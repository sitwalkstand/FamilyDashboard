services:
  dashboard:
    image: ghcr.io/sitwalkstand/familydashboard:latest
    container_name: family-dashboard
    restart: unless-stopped
    volumes:
      # SQLite database (calendar feed config, settings) - back this file up.
      - dashboard-data:/data
      # Point this at wherever your family photos live: a synced OneDrive/Google
      # Photos export folder, a Samba share, etc. Mount it read-only if you like.
      - ${PHOTO_FOLDER:-./photos}:/photos
    environment:
      # The dashboard itself always shows Eastern time (DashboardTimeZone); this
      # only sets the container's own clock, e.g. for log timestamps.
      - TZ=${TZ:-America/New_York}
      # Register http://<server-host>:8080/auth/google/callback in Google Cloud.
      # Put credentials in /data/google-oauth.json; the volume persists it.
      # Family Locations widget: Home Assistant address and long-lived access token
      # (set HA_BASE_URL and HA_TOKEN in the host's .env). Both optional.
      - HomeAssistant__BaseUrl=${HA_BASE_URL:-}
      - HomeAssistant__Token=${HA_TOKEN:-}
  caddy:
    build:
      context: ./caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - dashboard
volumes:
  dashboard-data:
  caddy-data:
  caddy-config:
