services:
  dashboard:
    image: ghcr.io/sitwalkstand/familydashboard:latest
    container_name: family-dashboard
    restart: unless-stopped
    volumes:
      # SQLite database (calendar feed config, settings) - back this file up.
      - dashboard-data:/data
      # Point this at wherever your family photos live: a synced OneDrive/Google
      # Photos export folder, a Samba share, etc. Mount it read-only if you like.
      - ${PHOTO_FOLDER:-./photos}:/photos:ro
    environment:
      - Weather__Latitude=38.9894
      - Weather__Longitude=-77.4794
      # Register http://<server-host>:8080/auth/google/callback in Google Cloud.
      # Put credentials in /data/google-oauth.json; the volume persists it.
  caddy:
    build:
      context: ./caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - dashboard
volumes:
  dashboard-data:
  caddy-data:
  caddy-config:
