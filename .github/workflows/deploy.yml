name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  
jobs:
  build-and-push:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"
          
      - name: Deploy to FamilyDashboard LXC
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy@192.168.1.150 '
            set -e
            cd "$HOME/familydashboard"

            test -w .git/objects || {
              echo ".git/objects is not writable by $(id -un)"
              ls -ld . .git .git/objects
              exit 1
            }

            git pull --ff-only origin main
            docker compose pull
            docker compose up -d
          '
